name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to delete/create releases
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ensure submodules (like scripts/eRelease) are cloned
          submodules: "recursive"
          # fetch full history (optional but helpful if scripts rely on tags/ancillary refs)
          fetch-depth: 0

      - name: Remove existing release if it exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The '|| true' ensures the step doesn't fail if the release doesn't exist yet.
          gh release delete ${{ github.ref_name }} --yes || echo "No existing release found for ${{ github.ref_name }}"

      - name: List workspace
        shell: pwsh
        run: |
          Write-Host "GITHUB_WORKSPACE: $env:GITHUB_WORKSPACE"
          Write-Host "Top-level files and directories recursive:"
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Force -Recurse | ForEach-Object { Write-Host $_.FullName }
      - name: Generate release notes
        id: gen_notes
        # run PowerShell to invoke the generate-release-notes function and return the path
        shell: pwsh
        run: |
          # import the module that defines Write-ReleaseNotes
          . "${{ github.workspace }}/scripts/eRelease/Write-ReleaseNotes.ps1"
          $notesFile, $variableMap, $notesDir = Write-ReleaseNotes
          Write-Host "Wrote release notes to: $notesFile"
          # expose the path as a step output (ensure it contains only the path)
          Add-Content -Path $env:GITHUB_OUTPUT -Value "notes_file=$notesFile"
          # print the notes file path to the step log
          Write-Host "notes_file=$notesFile"
          
      - name: Create GitHub Release (CLI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --notes-file "${{ steps.gen_notes.outputs.notes_file }}" \
            --draft=false \
            --prerelease=false
