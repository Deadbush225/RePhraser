name: Build Portable Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5>=5.15.10
          pip install pyinstaller
          pip install .

      - name: Build Windows portable executable
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          .\build-portable.bat --no-pause

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/RePhraser-${{ github.ref_name }}-Windows-x64-Portable.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal system dependencies
        run: |
          # Only install absolutely essential packages to avoid repository issues
          sudo apt-get update -qq || echo "Update failed, continuing..."
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libglib2.0-0 \
            libgl1-mesa-glx || echo "Some packages failed, continuing..."

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Try to install PyQt5 with binary wheels first, fallback to source if needed
          python -m pip install --only-binary=all PyQt5>=5.15.10 || python -m pip install PyQt5>=5.15.10
          python -m pip install pyinstaller
          # Install the project in development mode
          python -m pip install -e .

      - name: Build Linux portable executable
        env:
          VERSION: ${{ github.ref_name }}
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x build-portable.sh
          ./build-portable.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: dist/RePhraser-${{ github.ref_name }}-Linux-x64-Portable

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to delete/create releases
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Remove existing release if it exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The '|| true' ensures the step doesn't fail if the release doesn't exist yet.
          gh release delete ${{ github.ref_name }} --yes || echo "No existing release found for ${{ github.ref_name }}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate release notes
        id: gen_notes
        shell: pwsh
        run: |
          # Import the module that defines Write-ReleaseNotes
          . "${{ github.workspace }}/scripts/eRelease/Write-ReleaseNotes.ps1"
          $notesFile, $variableMap, $notesDir = Write-ReleaseNotes
          
          # Add platform-specific binaries section to the release notes
          $binariesSection = @"

          ## Binaries

          ### Windows
          - Download ``RePhraser-${{ github.ref_name }}-Windows-x64-Portable.exe``
          - Double-click to run (no installation needed)
          - All dependencies are bundled

          ### Linux
          - Download ``RePhraser-${{ github.ref_name }}-Linux-x64-Portable``
          - Make executable: ``chmod +x RePhraser-${{ github.ref_name }}-Linux-x64-Portable``
          - Run: ``./RePhraser-${{ github.ref_name }}-Linux-x64-Portable``
          "@
          
          # Append binaries section to the notes file
          Add-Content -Path $notesFile -Value $binariesSection
          
          # Expose the path as a step output
          Add-Content -Path $env:GITHUB_OUTPUT -Value "notes_file=$notesFile"
          Write-Host "Release notes file: $notesFile"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "RePhraser ${{ github.ref_name }}" \
            --notes-file "${{ steps.gen_notes.outputs.notes_file }}" \
            --draft=false \
            --prerelease=false \
            windows-portable/RePhraser-${{ github.ref_name }}-Windows-x64-Portable.exe \
            linux-portable/RePhraser-${{ github.ref_name }}-Linux-x64-Portable